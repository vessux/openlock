name: CodeQL

on:
  push:
    branches: [main]
  # Deliberately NOT filtered to `branches: [main]`. CodeQL is a required
  # status check on main, so a PR that never runs it can never merge — and
  # with a base filter, only a PR based directly on main ever triggers it.
  # That makes stacked PRs unmergeable: every layer above the bottom one is
  # based on the layer below, so it stays permanently BLOCKED waiting for a
  # check that will never run.
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v6

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
