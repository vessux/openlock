name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Lint (biome)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Dead code (knip)
        run: bun run knip

      - name: Real-state access (bd openlock-q7b8)
        run: bun run scripts/check-real-state-access.ts

  live-integration:
    # Live end-to-end tests gated behind OPENLOCK_LIVE_INTEGRATION=1 because
    # they build the sandbox image (~minutes first run), start the gateway,
    # and create real containers. Kept off the default `bun test` path so
    # local dev stays fast; this job runs them in CI so they're never
    # silently broken.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: test
    strategy:
      fail-fast: false
      matrix:
        runtime: [podman, docker]
    env:
      OPENLOCK_RUNTIME: ${{ matrix.runtime }}
      # bd openlock-o4t4: asserts this runner is a disposable host, i.e. a
      # test may safely mutate REAL host state (credentials, a real dev
      # gateway, real podman/docker storage) here rather than being
      # confined to synthetic tmpdir state. This runner qualifies: it is a
      # throwaway ubuntu-24.04 VM provisioned fresh for this job, with a
      # brand-new HOME and no operator credentials/gateway/containers on it
      # to begin with — nothing here needs to survive the job, so there is
      # nothing to protect by refusing. Set at job level (not just on the
      # "Integration tests" step) so it's visible to every step, matching
      # where OPENLOCK_RUNTIME already lives.
      #
      # tests/integration/disposable-host.test.ts is the other half of this:
      # a guard that turns "this var got silently dropped from this job" red
      # instead of letting every disposable-host-gated test start silently
      # refusing (or, worse, silently skipping) forever. See that file's own
      # comment for the exact CI-detection condition. The local-machine
      # equivalent of this marker (a disposable VM on a developer's own
      # laptop) is intentionally NOT set here — that is bd openlock-uze8,
      # a separate not-yet-built piece; this var is CI-only today.
      OPENLOCK_DISPOSABLE_HOST: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Preflight — fork release assets published? (bd openlock-lpc)
        # OPENSHELL_FORK_TAG pins a fork *tag*; the fork's own release
        # workflow builds cross-platform binaries asynchronously and can
        # take hours after the tag push (see docs/releasing.md, Part 1 —
        # the release-line model). If this job runs before assets land,
        # ensureFromRelease's `curl -f` 404s (exit 22) deep inside gateway
        # startup, ~10+ minutes into a 20-minute job, after podman/subuid
        # setup has already run.
        # Check the same URLs the real download uses (asked of
        # fork-binaries.ts, not re-derived here) and fail fast and
        # unambiguously instead.
        #
        # Deliberately NOT in the `test` job above: `live-integration` is not
        # a required check under the branch ruleset, so a release-ordering
        # false red here doesn't block merge; a false red in `test` would.
        # Moving this there would promote a non-blocking hazard into a
        # merge-blocking one, and would put a network dependency back into
        # the one job whose value is being hermetic (bd openlock-lpc part 1).
        #
        # Release assets are public — ensureFromRelease sends no auth, so
        # neither does this check. If vessux/OpenShell ever goes private,
        # every URL here 404s and this becomes a permanent false red; a
        # future reader hitting that should look here first, not assume the
        # release is stuck.
        run: |
          set -uo pipefail
          tag="$(bun -e 'import { OPENSHELL_FORK_TAG } from "./src/sandbox/fork-binaries"; console.log(OPENSHELL_FORK_TAG)')"
          missing=0
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            if ! curl -fsSIL -o /dev/null "$url"; then
              echo "::error::Fork release ${tag} asset not found: $url"
              missing=1
            fi
          done < <(bun run scripts/print-fork-asset-urls.ts)
          if [ "$missing" -ne 0 ]; then
            echo "::error::Fork release ${tag} is missing one or more assets this job needs. This is expected in the window right after a fork tag push — the release workflow builds binaries asynchronously and can take hours. Wait for https://github.com/vessux/OpenShell/releases/tag/${tag} to show all platform archives attached, then re-run this job."
            exit 1
          fi

      - name: Install podman (5.x+, heredoc-aware)
        if: matrix.runtime == 'podman'
        # ubuntu-24.04 ships podman 4.9.3 which mis-parses the shell-heredoc
        # `RUN cat > /sandbox/.claude.json <<'JSON'` block in containers/
        # core.Containerfile. Mac (5.8.2) and Lima (5.4.2) build fine. Pull the
        # current podman .deb from the alvistack OBS project (canonical source
        # for the current containers stack on noble). NOTE: this is a ROLLING
        # source — it now serves podman 6.x, not 5.x; the "Extend rootless
        # subuid/subgid range" step below compensates for a podman-6.x rootless
        # storage-default change. See bd openlock-sjr.
        run: |
          # Remove ubuntu-shipped podman + buildah and the golang-* helper
          # packages that own files (/etc/containers/policy.json,
          # registries.conf, etc.) which alvistack's containers-common also
          # ships — otherwise dpkg refuses to overwrite. Keep the purge
          # tolerant: not every package is present on every runner image.
          sudo apt-get purge -y podman buildah \
            golang-github-containers-common \
            golang-github-containers-image \
            containers-storage skopeo || true
          sudo mkdir -p /etc/apt/keyrings
          # Fetch from downloadcontent.opensuse.org (openSUSE's canonical content
          # host) rather than the download.opensuse.org mirror redirector. The
          # redirector routes apt to regional mirrors that intermittently serve
          # half-synced .debs — apt then rejects them ("File has unexpected size
          # ... Mirror sync in progress?", exit 100), which blocked CI on every
          # retry while the chosen mirror was mid-sync. The content host's index
          # and packages are always mutually consistent. See bd openlock-k3g.
          base="https://downloadcontent.opensuse.org/repositories/home:/alvistack/xUbuntu_24.04"
          curl -fsSL "${base}/Release.key" \
            | sudo gpg --dearmor -o /etc/apt/keyrings/alvistack.gpg
          echo "deb [signed-by=/etc/apt/keyrings/alvistack.gpg] ${base}/ /" \
            | sudo tee /etc/apt/sources.list.d/alvistack.list > /dev/null
          # Retry update+install a few times as belt-and-suspenders against any
          # transient fetch error; `apt-get clean` drops partials between tries.
          # `if`-condition form keeps a failed attempt from tripping `set -e`.
          # `--force-overwrite` catches any /etc/containers/* file not purged above.
          for attempt in 1 2 3; do
            if sudo apt-get update -qq \
              && sudo apt-get install -y \
                -o Dpkg::Options::=--force-overwrite \
                -o Acquire::Retries=3 \
                podman podman-gvproxy podman-aardvark-dns podman-netavark; then
              break
            fi
            echo "::warning::podman install attempt ${attempt} failed; cleaning and retrying"
            sudo apt-get clean
            sleep 15
          done
          podman --version

      - name: Extend rootless subuid/subgid range
        if: matrix.runtime == 'podman'
        # openlock-core images pin sandbox uid 999999 (see containers/
        # core.Containerfile for rationale). GH Actions ubuntu-24.04 ships
        # `runner` with /etc/subuid `runner:165536:65536` — too small for
        # uid 999999, so `podman build` hits `crun: setgroups: Invalid
        # argument` at `USER sandbox`. Widen the range to 1.1M before any
        # podman work, then re-migrate podman's user-namespace state.
        run: |
          # `$USER` must expand in the outer shell, not inside sudo (where it
          # would resolve to root). Pipe + tee handles that cleanly.
          echo "$USER:100000:1100000" | sudo tee /etc/subuid > /dev/null
          echo "$USER:100000:1100000" | sudo tee /etc/subgid > /dev/null
          # Pin rootless storage to the user's XDG paths. The alvistack repo now
          # serves podman 6.x, whose shipped /etc/containers/storage.conf sets
          # graphroot=/var/lib/containers/storage (rootful) and — unlike 5.x — no
          # longer auto-overrides it to the per-user path in rootless mode. So
          # `podman system migrate` as `runner` would mkdir the rootful path and
          # fail EPERM. An explicit user storage.conf restores the rootless
          # graphroot and is robust to further alvistack drift. See bd openlock-sjr.
          mkdir -p "$HOME/.config/containers"
          printf '[storage]\ndriver = "overlay"\ngraphroot = "%s/.local/share/containers/storage"\nrunroot = "/run/user/%s/containers"\n' \
            "$HOME" "$(id -u)" > "$HOME/.config/containers/storage.conf"
          podman system migrate
          # Surface effective config in the log so future drift is obvious.
          getent passwd "$USER" | cut -d: -f1,3
          grep "^$USER:" /etc/subuid /etc/subgid

      - name: Start rootless podman socket
        if: matrix.runtime == 'podman'
        # The gateway resolves /run/user/$UID/podman/podman.sock at startup
        # (see resolvePodmanSocket in ensure-gateway.ts), so the runner needs
        # a live podman.socket before the gateway starts.
        run: |
          systemctl --user enable --now podman.socket
          # Verify the socket landed where the gateway expects it.
          podman info --format '{{.Host.RemoteSocket.Path}}'

      - name: Ensure docker available
        if: matrix.runtime == 'docker'
        # ubuntu-24.04 GH runners ship docker preinstalled (moby-engine) with
        # the runner user already in the `docker` group. Installing docker.io
        # from apt collides with the preinstalled `containerd` package
        # (containerd.io conflicts with containerd). Just verify the
        # preinstalled daemon is reachable.
        run: |
          docker --version
          sudo systemctl start docker || true
          # Verify daemon reachable (SIGPIPE under pipefail if we pipe to head).
          docker info > /dev/null
          id "$USER"
          groups "$USER"

      - name: Integration tests (OPENLOCK_LIVE_INTEGRATION=1)
        id: integration
        env:
          OPENLOCK_LIVE_INTEGRATION: "1"
        run: bun test tests/integration/

      - name: Assert gateway is clean after live-integration (bd openlock-n73d)
        # WHY THIS STEP EXISTS: openlock-18c (PR #144) fixed the suite's
        # resource leak (per-file teardown registry + unconditional
        # `afterAll` + a wait for the async `sandbox delete`), but nothing
        # asserted the fix keeps working. This job cannot catch a
        # regression on its own — it always starts from a FRESH gateway, so
        # a leak here is invisible; it only resurfaces on a SECOND run
        # sharing gateway state (e.g. a developer's own dev gateway) as a
        # confusing "provider already exists" / "attached to sandbox(es)"
        # error, which is exactly how the original leak got misread as a
        # product defect instead of a test-teardown bug. This step makes
        # that failure mode a red check here instead.
        #
        # `if: always()` — this must run even when the "Integration tests"
        # step above failed, because a failed run (which may skip `afterAll`
        # partway through, per the bun-test-timeout-skips-afterAll gotcha
        # openlock-18c ran into) is the most likely time for residue to be
        # left behind, and that residue is exactly what we want surfaced.
        # This does NOT mask a real test failure: a GitHub Actions job is
        # red if ANY step fails, so a failing "Integration tests" step
        # already fails the job regardless of what this step reports.
        #
        # Deliberately read-only — see the script's own header for why this
        # is an assertion, never a delete sweep (openlock-18c already
        # rejected that shape once, for the same suite, against the same
        # kind of gateway).
        #
        # The condition is `!cancelled() && integration didn't skip` rather
        # than a bare `always()`: the assertion is only meaningful if the
        # suite actually ran. If an earlier setup step failed (podman/docker
        # install, or the fork-release preflight), the `integration` step is
        # skipped and no gateway ever came up — `sandbox list` would then
        # fail against an unreachable gateway and bury the real failure
        # under a confusing secondary error. Skipping cancellations avoids
        # the same noise on a cancelled run. A genuine test FAILURE still
        # runs this step (outcome is `failure`, not `skipped`), which is the
        # case that matters most: a failed/timed-out run is the most likely
        # to leave residue behind.
        if: ${{ !cancelled() && steps.integration.outcome != 'skipped' }}
        run: bun run scripts/check-live-integration-residue.ts
