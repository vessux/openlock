name: base-image

# Builds the multi-arch (amd64 + arm64) openlock-base image and pushes it to
# ghcr.io/vessux/openlock-base:<hash>, where <hash> = sha256(base.Containerfile)
# [0..12] — the exact tag the host computes in src/sandbox/ensure-base.ts. The
# host tries `<runtime> pull <tag>` before any local build, so a fresh install
# skips the slow apt/node/uv install whenever this image is available.
#
# Trigger: release tags, PLUS main pushes that touch base.Containerfile
# (openlock-6qfr). A released binary embeds a frozen base.Containerfile, so
# building on the tag guarantees that release's base hash exists in ghcr —
# that's still the durable per-release guarantee and the tag trigger stays
# for it. But base.Containerfile can change on main (e.g. PR #133's nftables
# fix) well before the next release is tagged, and the content-addressed tag
# for that new hash is never built until it is — every live-integration run
# (and every fresh install) in that window pays a full local rebuild
# (apt + node + uv) instead of a cheap pull, and the resulting registry-pull
# failure reads like a hard error with nothing saying a non-fatal local
# build follows. The main-push trigger closes that window: `paths:` narrows
# it to base.Containerfile itself, so a main push that doesn't touch that
# file never runs this workflow at all, and the existing idempotency check
# below skips the (QEMU-emulated, ~10-15 min arm64) build whenever the
# computed tag is already present — so the only marginal cost this trigger
# ever adds is one cheap `docker buildx imagetools inspect` per
# base.Containerfile-touching push whose hash was already published.
# Manual dispatch is kept as an escape hatch / bootstrap.
#
# DO NOT "fix" the apparent tags-vs-paths conflict below by splitting the
# trigger or dropping `paths:`. It looks like `paths:` would also gate the
# tag trigger (which would be release-breaking: a tagged release could ship
# with its base hash unpublished, the exact guarantee the tag trigger
# exists to provide). It does not — GitHub documents that "path filters are
# not evaluated for pushes of tags", verified against the Actions workflow-
# syntax reference on 2026-08-05. So a tag push always builds regardless of
# what it touched, and `paths:` only ever narrows the main-branch trigger.
#
# ONE-TIME SETUP: the first push creates a PRIVATE ghcr package. Flip
# ghcr.io/vessux/openlock-base to public (GitHub → Packages → Package settings)
# so end users' unauthenticated `podman pull` works. Local build remains the
# fallback for air-gapped users, so this is a performance win, not a hard dep.

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
    paths:
      - "containers/base.Containerfile"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: base-image
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  push-base:
    name: Build & push openlock-base
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Compute base tag (same code path as the host)
        id: tag
        run: |
          set -euo pipefail
          TAG="$(bun run src/cli.ts --print-base-tag)"
          echo "Computed base tag: ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if tag already exists
        id: check
        run: |
          set -uo pipefail
          if docker buildx imagetools inspect "${{ steps.tag.outputs.tag }}" >/dev/null 2>&1; then
            echo "Image already present in ghcr — skipping build."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Image not found — will build & push."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v4
        if: steps.check.outputs.exists == 'false'

      - uses: docker/setup-buildx-action@v4
        if: steps.check.outputs.exists == 'false'

      - name: Build & push (amd64 + arm64)
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: containers
          file: containers/base.Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tag.outputs.tag }}
          # Match the fork-binary trust model (no attestation) and keep the
          # pushed manifest a clean per-arch image index that podman resolves
          # reliably — buildx provenance attestations can trip podman's arch
          # selection.
          provenance: false
